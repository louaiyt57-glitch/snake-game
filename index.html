<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>لعبة الثعبان</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    touch-action: manipulation;
  }
  h1 { font-size: 1.4rem; }
  #hud { display: flex; gap: 24px; font-size: 1.1rem; }
  #hud strong { color: #4ade80; }
  #board {
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 8px;
    max-width: 90vmin;
    max-height: 70vmin;
  }
  #status { min-height: 1.5rem; font-size: 1rem; color: #94a3b8; }
  #status.over { color: #f87171; font-weight: bold; }
  button {
    background: #22c55e;
    color: #052e16;
    border: none;
    border-radius: 8px;
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #4ade80; }
</style>
</head>
<body>
  <h1>لعبة الثعبان</h1>
  <div id="hud">
    <span>النقاط: <strong id="score">0</strong></span>
    <span>أفضل نتيجة: <strong id="best">0</strong></span>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="status">استخدم الأسهم أو اسحب على الشاشة للتحكم</div>
  <button id="restart">ابدأ من جديد</button>
<script>
(function () {
  const GRID = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const CELL = canvas.width / GRID;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart');

  let snake, dir, nextDir, food, score, alive, timer, speed;
  let best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function spawnFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 130;
    alive = true;
    scoreEl.textContent = '0';
    statusEl.textContent = 'استخدم الأسهم أو اسحب على الشاشة للتحكم';
    statusEl.classList.remove('over');
    spawnFood();
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      bestEl.textContent = best;
      statusEl.textContent = 'انتهت اللعبة! رقم قياسي جديد: ' + score;
    } else {
      statusEl.textContent = 'انتهت اللعبة! النتيجة: ' + score;
    }
    statusEl.classList.add('over');
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) { gameOver(); return; }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      spawnFood();
      if (score % 5 === 0 && speed > 60) {
        speed -= 10;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function turn(x, y) {
    if (!alive) return;
    if (x === -dir.x && y === -dir.y) return; // لا رجوع للخلف
    nextDir = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    const arrows = {
      ArrowUp: [0, -1], ArrowDown: [0, 1],
      ArrowLeft: [-1, 0], ArrowRight: [1, 0]
    };
    if (arrows[e.key]) {
      e.preventDefault();
      turn(arrows[e.key][0], arrows[e.key][1]);
    } else if (e.key === ' ' && !alive) {
      reset();
    }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: false });

  restartBtn.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
